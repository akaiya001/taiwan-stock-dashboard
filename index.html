<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>戰情看板</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0e0e0e;--bg2:#161616;--bg3:#1e1e1e;
  --border:#2a2a2a;--text:#e0e0e0;--sub:#888;--dim:#555;
  --up:#e05c5c;--dn:#26a269;
  --ma1:#f5a623;--ma2:#5c8ae0;--ma3:#26a269;
  --accent:#5c8ae0;--grid:rgba(255,255,255,0.06);--tick:#666;
}
body.light{
  --bg:#f5f5f5;--bg2:#ffffff;--bg3:#ebebeb;
  --border:#d0d0d0;--text:#1a1a1a;--sub:#666;--dim:#aaa;
  --up:#c0392b;--dn:#1a7a45;
  --ma1:#d4820a;--ma2:#2c5faa;--ma3:#1a7a45;
  --accent:#2c5faa;--grid:rgba(0,0,0,0.07);--tick:#999;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;transition:background .2s,color .2s;}
.toolbar{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--bg2);flex-wrap:wrap;}
.toolbar input{width:88px;padding:5px 8px;font-size:13px;border:1px solid var(--border);border-radius:5px;background:var(--bg3);color:var(--text);}
.toolbar input:focus{outline:none;border-color:var(--accent);}
.btn{padding:5px 12px;font-size:12px;border:1px solid var(--border);border-radius:5px;background:var(--bg3);color:var(--text);cursor:pointer;white-space:nowrap;}
.btn:hover{border-color:var(--accent);}
.btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.sep{width:1px;height:18px;background:var(--border);flex-shrink:0;}
.status{font-size:11px;color:var(--dim);margin-left:auto;}
.status.ok{color:var(--dn);}.status.err{color:var(--up);}
#theme-btn{font-size:15px;padding:4px 8px;line-height:1;}
.list-view{display:block;}.list-view.hidden{display:none;}
.list-header{display:grid;grid-template-columns:90px 1fr 140px;gap:8px;padding:6px 14px;border-bottom:1px solid var(--border);font-size:11px;color:var(--dim);}
.row{display:grid;grid-template-columns:90px 1fr 140px;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;}
.row:hover{background:var(--bg2);}
.sym{font-size:14px;font-weight:600;}.sname{font-size:11px;color:var(--sub);margin-top:1px;}
.rm-btn{font-size:10px;color:var(--dim);cursor:pointer;margin-top:3px;display:inline-block;}
.rm-btn:hover{color:var(--up);}
.price{font-size:18px;font-weight:600;}.chg{font-size:12px;}
.meta{font-size:11px;color:var(--sub);margin-top:3px;}
.up{color:var(--up);}.dn{color:var(--dn);}
.mini-wrap{position:relative;height:44px;}
.loading-row{padding:20px 14px;color:var(--dim);font-size:12px;}
.snap-tag{font-size:10px;color:var(--dim);margin-left:4px;}
.drag-handle{font-size:18px;color:var(--dim);cursor:grab;user-select:none;line-height:1;padding:0 2px;}
.drag-handle:active{cursor:grabbing;}
.row.drag-over{border-top:2px solid var(--accent);background:var(--bg2);}
.detail-view{display:none;}.detail-view.open{display:block;}
.dh{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border);background:var(--bg2);flex-wrap:wrap;}
.dp{font-size:22px;font-weight:600;}.dmeta{font-size:11px;color:var(--sub);}
.nav-btn{padding:4px 10px;font-size:16px;border:1px solid var(--border);border-radius:5px;background:var(--bg3);color:var(--text);cursor:pointer;line-height:1;}
.nav-btn:hover{border-color:var(--accent);color:var(--accent);}
.nav-btn:disabled{opacity:0.3;cursor:default;}
.stock-counter{font-size:11px;color:var(--dim);}

/* ── zoom 控制列 ── */
.zoom-bar{display:flex;gap:6px;align-items:center;padding:5px 14px;background:var(--bg2);border-bottom:1px solid var(--border);}
.zoom-info{font-size:11px;color:var(--dim);margin-left:6px;}
/* ── 滑桿 ── */
.slider-wrap{padding:4px 14px 6px;background:var(--bg2);border-bottom:1px solid var(--border);}
#range-slider{
  width:100%;height:4px;
  -webkit-appearance:none;appearance:none;
  background:var(--border);border-radius:2px;outline:none;cursor:pointer;
}
#range-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--accent);cursor:pointer;border:2px solid var(--bg2);
}
#range-slider::-moz-range-thumb{
  width:16px;height:16px;border-radius:50%;
  background:var(--accent);cursor:pointer;border:2px solid var(--bg2);
}

.cs{padding:10px 14px;}
.clabel{font-size:11px;color:var(--sub);margin-bottom:4px;display:flex;align-items:center;gap:8px;}
.ind-row{display:flex;gap:8px;margin-top:6px;}
.ind-row>div{flex:1;min-width:0;}
.prel{position:relative;}
.panel{display:none;position:absolute;top:36px;right:0;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;z-index:30;min-width:215px;max-height:80vh;overflow-y:auto;}
.panel.open{display:block;}
.panel-title{font-size:12px;font-weight:600;color:var(--text);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.psub{font-size:11px;color:var(--dim);margin:10px 0 6px;padding-top:8px;border-top:1px solid var(--border);}
.psub.first{margin-top:0;border-top:none;padding-top:0;}
.prow{display:flex;align-items:center;gap:6px;margin-bottom:7px;font-size:12px;color:var(--sub);}
.prow label{min-width:56px;font-size:11px;color:var(--dim);}
.prow input[type=number]{width:52px;padding:3px 6px;font-size:12px;border:1px solid var(--border);border-radius:4px;background:var(--bg3);color:var(--text);}
.prow input[type=checkbox]{width:14px;height:14px;cursor:pointer;accent-color:var(--accent);}
.swatch{width:12px;height:3px;border-radius:2px;flex-shrink:0;}
</style>
</head>
<body>

<div class="toolbar">
  <input id="sym-input" placeholder="輸入股號" maxlength="6" onkeydown="if(event.key==='Enter')addStock()"/>
  <button class="btn" onclick="addStock()">+ 加入</button>
  <div class="sep"></div>
  <button class="btn active" id="btn-D" onclick="setTf('D',this)">日線</button>
  <button class="btn" id="btn-5" onclick="setTf('5',this)">5 分</button>
  <div class="sep"></div>
  <button class="btn" id="theme-btn" onclick="toggleTheme()" title="切換主題">🌙</button>
  <span class="status" id="conn-status">連線中...</span>
</div>

<div class="list-view" id="list-view">
  <div class="list-header"><span>股票</span><span>報價</span><span style="font-size:11px;color:var(--dim)">MACD 5分</span></div>
  <div id="rows-container"></div>
</div>

<div class="detail-view" id="detail-view">
  <!-- header -->
  <div class="dh">
    <button class="btn" onclick="closeDetail()">← 返回</button>
    <button class="nav-btn" id="nav-prev" onclick="navStock(-1)" title="上一檔 ↑">▲</button>
    <button class="nav-btn" id="nav-next" onclick="navStock(1)"  title="下一檔 ↓">▼</button>
    <span class="stock-counter" id="stock-counter"></span>
    <div>
      <span id="d-sym" style="font-size:14px;font-weight:600;"></span>
      <span id="d-name" style="font-size:12px;color:var(--sub);margin-left:6px;"></span>
    </div>
    <span class="dp" id="d-price"></span>
    <span style="font-size:13px;" id="d-chg"></span>
    <span class="dmeta" id="d-meta"></span>
    <div style="flex:1"></div>
    <div class="prel">
      <button class="btn" onclick="togglePanel()">⚙ 指標設定</button>
      <div class="panel" id="main-panel">
        <div class="panel-title">指標參數設定</div>
        <div class="psub first">均線</div>
        <div class="prow"><input type="checkbox" id="ma1-on" checked onchange="applyAll()"><span class="swatch" style="background:var(--ma1)"></span><label>MA</label><input type="number" id="ma1-n" value="5" min="1" max="999" onchange="applyAll()"><span style="font-size:11px;color:var(--dim)">期</span></div>
        <div class="prow"><input type="checkbox" id="ma2-on" checked onchange="applyAll()"><span class="swatch" style="background:var(--ma2)"></span><label>MA</label><input type="number" id="ma2-n" value="20" min="1" max="999" onchange="applyAll()"><span style="font-size:11px;color:var(--dim)">期</span></div>
        <div class="prow"><input type="checkbox" id="ma3-on" checked onchange="applyAll()"><span class="swatch" style="background:var(--ma3)"></span><label>MA</label><input type="number" id="ma3-n" value="240" min="1" max="999" onchange="applyAll()"><span style="font-size:11px;color:var(--dim)">期</span></div>
        <div class="psub">均量</div>
        <div class="prow"><input type="checkbox" id="vma1-on" checked onchange="applyAll()"><span class="swatch" style="background:var(--ma1)"></span><label>MA</label><input type="number" id="vma1-n" value="5" min="1" max="999" onchange="applyAll()"><span style="font-size:11px;color:var(--dim)">期</span></div>
        <div class="prow"><input type="checkbox" id="vma2-on" checked onchange="applyAll()"><span class="swatch" style="background:var(--ma2)"></span><label>MA</label><input type="number" id="vma2-n" value="20" min="1" max="999" onchange="applyAll()"><span style="font-size:11px;color:var(--dim)">期</span></div>
        <div class="psub">KD</div>
        <div class="prow"><label>RSV 週期</label><input type="number" id="kd-n" value="9" min="1" max="99" onchange="applyAll()"></div>
        <div class="prow"><label>K 平滑</label><input type="number" id="kd-k" value="3" min="1" max="99" onchange="applyAll()"></div>
        <div class="prow"><label>D 平滑</label><input type="number" id="kd-d" value="3" min="1" max="99" onchange="applyAll()"></div>
        <div class="psub">MACD</div>
        <div class="prow"><label>快線 EMA</label><input type="number" id="macd-f" value="12" min="1" max="99" onchange="applyAll()"></div>
        <div class="prow"><label>慢線 EMA</label><input type="number" id="macd-s" value="26" min="1" max="99" onchange="applyAll()"></div>
        <div class="prow"><label>信號線</label><input type="number" id="macd-sig" value="9" min="1" max="99" onchange="applyAll()"></div>
        <button class="btn" style="width:100%;margin-top:8px;background:var(--accent);color:#fff;border-color:var(--accent);" onclick="applyAll()">套用所有參數</button>
        <button class="btn" style="width:100%;margin-top:6px;" onclick="togglePanel()">關閉</button>
      </div>
    </div>
  </div>

  <!-- zoom 按鈕列 -->
  <div class="zoom-bar">
    <button class="btn" onclick="zoomBy(2)"   title="放大：顯示更少根">＋ 放大</button>
    <button class="btn" onclick="zoomBy(0.5)" title="縮小：顯示更多根">－ 縮小</button>
    <button class="btn" onclick="zoomReset()" title="顯示全部">⟳ 全部</button>
    <div class="sep"></div>
    <button class="btn" id="priceline-btn" onclick="togglePriceLine()" title="查價線：滑鼠移動顯示各圖對應數值">📍 查價線</button>
    <span id="priceline-info" style="font-size:11px;color:var(--accent);min-width:160px;"></span>
    <span class="zoom-info" id="zoom-info"></span>
  </div>

  <!-- 圖表區 -->
  <div class="cs">
    <div class="clabel">K 線 <span id="ma-legend" style="display:flex;gap:10px;"></span></div>
    <div style="position:relative;height:200px;" id="dk-wrap">
      <canvas id="d-k"></canvas>
      <canvas id="pl-overlay" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;display:none;"></canvas>
    </div>
    <div style="height:1px;background:var(--border);margin:6px 0"></div>
    <div class="ind-row">
      <div><div class="clabel">成交量 <span id="vma-legend" style="display:flex;gap:8px;"></span></div>
           <div style="position:relative;height:68px;"><canvas id="d-v"></canvas></div></div>
      <div><div class="clabel" id="kd-label">KD</div>
           <div style="position:relative;height:68px;"><canvas id="d-kd"></canvas></div></div>
      <div><div class="clabel" id="macd-label">MACD</div>
           <div style="position:relative;height:68px;"><canvas id="d-macd"></canvas></div></div>
    </div>
  </div>

  <!-- 底部滑桿 -->
  <div class="slider-wrap">
    <input type="range" id="range-slider" min="0" max="100" value="100"
           oninput="onSlider(this.value)" title="左右平移"/>
  </div>
</div>

<script>
const API='/api', TICK_MS=5000;
let isLight=false;
function toggleTheme(){
  isLight=!isLight; document.body.classList.toggle('light',isLight);
  document.getElementById('theme-btn').textContent=isLight?'🌙':'☀️';
  if(detailSym&&detailData.length) buildDetailCharts();
}

const nameCache={};
let stocks=JSON.parse(localStorage.getItem('watchlist')||'[]');
let quoteCache={},prevQuote={},miniCharts={},tickTimer=null;
let detailSym=null,detailData=[],detailCharts={},detailTimer=null,tf='D',priceHistory={};

// ── 視窗狀態（全部圖表共用）────────────────────────────────
// viewEnd = 最右顯示的索引（通常是最後一根，即最新）
// viewSize = 視窗顯示幾根
let viewEnd=0, viewSize=60;

function saveWatchlist(){ localStorage.setItem('watchlist',JSON.stringify(stocks)); }

// ══════════════════════════════════════════════════════════
//  視窗控制：縮放 & 滑桿  ← 核心邏輯
// ══════════════════════════════════════════════════════════

// zoomBy(factor): factor>1 放大（少根），factor<1 縮小（多根）
// 縮放基準點永遠是最右側（最新日期）
function zoomBy(factor){
  const total=detailData.length;
  viewSize=Math.round(viewSize/factor);
  viewSize=Math.max(10, Math.min(total, viewSize)); // 最少10根，最多全部
  // 縮放後維持 viewEnd 不變（鎖右側）
  applyView();
}

function zoomReset(){
  viewSize=detailData.length;
  viewEnd=detailData.length-1;
  applyView();
}

// 滑桿：0=最左（最舊），100=最右（最新）
function onSlider(val){
  const total=detailData.length;
  // val=100 → viewEnd=total-1（最新）
  // val=0   → viewEnd=viewSize-1（最舊端）
  const minEnd=viewSize-1;
  const maxEnd=total-1;
  viewEnd=Math.round(minEnd+(maxEnd-minEnd)*(val/100));
  viewEnd=Math.max(minEnd, Math.min(maxEnd, viewEnd));
  applyView();
}

function applyView(){
  const total=detailData.length;
  viewEnd=Math.max(viewSize-1, Math.min(total-1, viewEnd));
  const start=viewEnd-viewSize+1;
  const end=viewEnd;

  // ── Y 軸根據當前可見範圍重算（讓 K 棒撐滿）──
  const winData=detailData.slice(start, end+1);
  const{yMin,yMax}=getYRange(winData);
  if(detailCharts.k){
    detailCharts.k.options.scales.y.min=yMin;
    detailCharts.k.options.scales.y.max=yMax;
  }

  // 更新所有圖表 x 軸範圍
  ['k','v','kd','macd'].forEach(id=>{
    const c=detailCharts[id]; if(!c) return;
    c.options.scales.x.min=start;
    c.options.scales.x.max=end;
    c.update('none');
  });

  // 同步滑桿位置
  const minEnd=viewSize-1;
  const sliderVal=minEnd>=(total-1)?100:Math.round((viewEnd-minEnd)/((total-1)-minEnd)*100);
  document.getElementById('range-slider').value=sliderVal;

  // 更新顯示資訊
  const sd=(detailData[start]?.t||'').slice(0,10);
  const ed=(detailData[end]?.t||'').slice(0,10);
  document.getElementById('zoom-info').textContent=`顯示 ${viewSize} 根　${sd} → ${ed}`;
}

// K線圖滾輪縮放（鎖右側）
function setupWheelZoom(){
  document.getElementById('d-k').addEventListener('wheel',e=>{
    e.preventDefault();
    zoomBy(e.deltaY<0?1.3:0.77);
  },{passive:false});
}

// ══════════════════════════════════════════════════════════
//  查價線（Price Line）
// ══════════════════════════════════════════════════════════
let priceLineActive = false;
let priceLineIndex  = -1;   // 目前停在哪根 (data index)

// Chart.js 全域 plugin：在每個子圖 afterDraw 時畫垂直線
const priceLinePlugin = {
  id: 'priceLinePlugin',
  afterDraw(chart) {
    if (!priceLineActive || priceLineIndex < 0) return;
    const xScale = chart.scales.x;
    if (!xScale) return;
    const x = xScale.getPixelForValue(priceLineIndex);
    if (x < xScale.left || x > xScale.right) return;
    const { ctx, chartArea: { top, bottom } } = chart;
    ctx.save();
    ctx.beginPath();
    ctx.setLineDash([4, 3]);
    ctx.strokeStyle = 'rgba(255,200,50,0.85)';
    ctx.lineWidth = 1.2;
    ctx.moveTo(x, top);
    ctx.lineTo(x, bottom);
    ctx.stroke();
    ctx.restore();
  }
};
Chart.register(priceLinePlugin);

function togglePriceLine() {
  priceLineActive = !priceLineActive;
  const btn = document.getElementById('priceline-btn');
  const overlay = document.getElementById('pl-overlay');
  btn.classList.toggle('active', priceLineActive);
  if (priceLineActive) {
    overlay.style.display = 'block';
    setupPriceLineEvents();
  } else {
    overlay.style.display = 'none';
    priceLineIndex = -1;
    document.getElementById('priceline-info').textContent = '';
    refreshPriceLine();
  }
}

function setupPriceLineEvents() {
  const kCanvas = document.getElementById('d-k');
  // 避免重複綁定
  if (kCanvas._plBound) return;
  kCanvas._plBound = true;
  kCanvas.addEventListener('mousemove', onPLMove);
  kCanvas.addEventListener('mouseleave', onPLLeave);
  kCanvas.addEventListener('touchmove', onPLTouch, { passive: true });

  // 不管查價線是否啟用，滑鼠移動都更新 MA legend 數值
  if (!kCanvas._maLegendBound) {
    kCanvas._maLegendBound = true;
    kCanvas.addEventListener('mousemove', e => {
      const chart = detailCharts.k; if (!chart) return;
      const rect = e.target.getBoundingClientRect();
      const rawIdx = chart.scales.x.getValueForPixel(e.clientX - rect.left);
      const idx = Math.max(0, Math.min(detailData.length - 1, Math.round(rawIdx)));
      updateMALegendAtIndex(idx);
    });
    kCanvas.addEventListener('mouseleave', () => resetMALegend());
  }
}

function onPLMove(e) {
  if (!priceLineActive) return;
  const chart = detailCharts.k; if (!chart) return;
  const rect = e.target.getBoundingClientRect();
  const px = e.clientX - rect.left;
  movePLToPixel(px, chart);
}

function onPLLeave() {
  // 離開畫布時保留最後位置，不清除
}

function onPLTouch(e) {
  if (!priceLineActive || !e.touches[0]) return;
  const chart = detailCharts.k; if (!chart) return;
  const rect = e.target.getBoundingClientRect();
  const px = e.touches[0].clientX - rect.left;
  movePLToPixel(px, chart);
}

function movePLToPixel(px, chart) {
  const xScale = chart.scales.x;
  if (!xScale) return;
  // 將像素轉為最近的整數索引
  const rawIdx = xScale.getValueForPixel(px);
  const idx = Math.round(rawIdx);
  const clamped = Math.max(Math.floor(xScale.min), Math.min(Math.floor(xScale.max), idx));
  movePLToIndex(clamped);
}

function movePLToIndex(idx) {
  if (idx < 0 || idx >= detailData.length) return;
  priceLineIndex = idx;
  refreshPriceLine();
  updateMALegendAtIndex(idx);
  // 更新資訊列
  const bar = detailData[idx];
  if (!bar) return;
  const label = bar.t
    ? (tf === 'D' ? bar.t.slice(0, 10) : bar.t.slice(5, 16))
    : `第${idx+1}根`;
  const chg  = bar.close && bar.open ? (bar.close - bar.open).toFixed(2) : '';
  document.getElementById('priceline-info').textContent =
    `${label}  開${bar.open}  高${bar.high}  低${bar.low}  收${bar.close}` +
    (chg ? `  ${+chg >= 0 ? '+' : ''}${chg}` : '');
}

function refreshPriceLine() {
  ['k','v','kd','macd'].forEach(id => {
    const c = detailCharts[id]; if (!c) return;
    c.update('none');
  });
}

// ── 上下切換 ──────────────────────────────────────────────
function navStock(dir){
  const idx=stocks.indexOf(detailSym), next=idx+dir;
  if(next<0||next>=stocks.length) return;
  openDetail(stocks[next]);
}
function updateNavButtons(){
  const idx=stocks.indexOf(detailSym);
  document.getElementById('nav-prev').disabled=(idx<=0);
  document.getElementById('nav-next').disabled=(idx>=stocks.length-1);
  document.getElementById('stock-counter').textContent=`${idx+1}/${stocks.length}`;
}

async function checkConn(){
  try{const r=await fetch(`${API}/quotes`,{signal:AbortSignal.timeout(3000)});setStatus(r.ok?'後端已連線':'後端錯誤',r.ok?'ok':'err');}
  catch{setStatus('無法連線後端','err');}
}
function setStatus(msg,cls=''){const el=document.getElementById('conn-status');el.textContent=msg;el.className='status '+cls;}
function getColors(){
  const s=getComputedStyle(document.body);
  return{grid:s.getPropertyValue('--grid').trim(),tick:s.getPropertyValue('--tick').trim(),

async function addStock(){
  const v=document.getElementById('sym-input').value.trim().toUpperCase();
  if(!v||stocks.includes(v)) return;
  try{const chk=await fetch(`${API}/ready`);if(!(await chk.json()).ready){setStatus('SDK 尚未就緒','err');return;}}
  catch{setStatus('無法連線後端','err');return;}
  stocks.push(v); document.getElementById('sym-input').value='';
  saveWatchlist(); renderRows();
  fetch(`${API}/subscribe`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbols:[v]})}).catch(()=>{});
  await fetchSnapshot(v);
}

async function fetchSnapshot(sym){
  try{
    const r=await fetch(`${API}/snapshot?symbol=${sym}`),d=await r.json();
    nameCache[sym]=d.name&&d.name!==sym?d.name:sym;
    const price=d.price||0;
    if(!quoteCache[sym]||!quoteCache[sym].price)
      quoteCache[sym]={
        price, isSnap:true,
        prevClose: d.prevClose || d.open || price,  // 鎖定昨收基準
        open:   d.open   ||price,
        high:   d.high   ||price,
        low:    d.low    ||price,
        volume: d.volume ||0,
        bid:    d.bid    ||0,
        ask:    d.ask    ||0,
      };
    renderRows();
  }catch{nameCache[sym]=sym;renderRows();}
}

async function removeStock(sym,e){
  e.stopPropagation(); stocks=stocks.filter(s=>s!==sym);
  delete quoteCache[sym];delete prevQuote[sym];delete priceHistory[sym];
  if(miniCharts[sym]){miniCharts[sym].destroy();delete miniCharts[sym];}
  saveWatchlist();
  fetch(`${API}/unsubscribe`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbol:sym})}).catch(()=>{});
  renderRows();
}

async function pollQuotes(){
  try{
    const r=await fetch(`${API}/quotes`),ws=await r.json();
    stocks.forEach(sym=>{
      if(!ws[sym]||!ws[sym].price) return;
      const prev=quoteCache[sym]||{};
      quoteCache[sym]={
        ...ws[sym],
        isSnap: false,
        // prevClose 只在第一次設定，之後鎖定不覆蓋（避免漲跌基準跳動）
        prevClose: prev.prevClose || ws[sym].prevClose || ws[sym].open || ws[sym].price,
      };
    });
    stocks.forEach(sym=>{
      const p=quoteCache[sym]?.price; if(!p) return;
      if(!priceHistory[sym]) priceHistory[sym]=[];
      priceHistory[sym].push(p); if(priceHistory[sym].length>60) priceHistory[sym].shift();
    });
    renderRows(); if(detailSym) updateDetailHeader(detailSym);
  }catch{}
}
function startPoll(){if(tickTimer)clearInterval(tickTimer);tickTimer=setInterval(pollQuotes,TICK_MS);pollQuotes();}

function renderRows(){

    container.innerHTML='';

          <div><div class="sym">${sym}</div><div class="sname" id="sname-${sym}">${nameCache[sym]||sym}</div>
            <div class="rm-btn" onclick="removeStock('${sym}',event)">移除</div></div>
        </div>
        <div>
          <div style="display:flex;gap:10px;align-items:baseline">
            <span class="price" id="price-${sym}">---</span>
            <span class="chg"  id="chg-${sym}"></span>
            <span id="voltag-${sym}" style="display:none;font-size:11px;font-weight:600;color:#f5a623;background:#f5a62322;padding:1px 6px;border-radius:4px;"></span>
          </div>
          <div class="meta" id="meta-${sym}">量 0</div>
        </div>
        <div style="position:relative;height:44px;width:140px;">
          <span id="mini-label-${sym}" style="position:absolute;top:1px;left:2px;font-size:9px;color:var(--dim);z-index:1;"></span>

        </div>`;
      row.onclick=(e)=>{ if(e.target.classList.contains('drag-handle')||e.target.classList.contains('rm-btn')) return; openDetail(sym); };
      // 拖曳
      row.addEventListener('dragstart',e=>{ dragSrc=row; row.style.opacity='0.4'; e.dataTransfer.effectAllowed='move'; });
      row.addEventListener('dragend',()=>{ row.style.opacity=''; container.querySelectorAll('.row').forEach(r=>r.classList.remove('drag-over')); });
      row.addEventListener('dragover',e=>{ e.preventDefault(); container.querySelectorAll('.row').forEach(r=>r.classList.remove('drag-over')); row.classList.add('drag-over'); });
      row.addEventListener('drop',e=>{

      updateRowValues(sym);

  // 只更新數字部分
  stocks.forEach(sym=>updateRowValues(sym));
}

// ── 時間係數表（依截圖）──────────────────────────────────
const TIME_FACTOR = {
  '09:15':8, '09:30':5, '09:45':4, '10:00':3,
  '10:15':2.5,'10:30':2.2,'10:45':2, '11:00':1.8,
  '11:15':1.7,'11:30':1.6,'11:45':1.5,'12:00':1.45,
  '12:15':1.38,'12:30':1.32,'12:45':1.25,'13:00':1.18,
  '13:15':1.11,'13:30':1
};

function getTimeFactor(){
  const now = new Date();
  const hh = now.getHours(), mm = now.getMinutes();
  const total = hh*60+mm;
  // 找最近的時間點（取不超過當前時間的最大值）
  let factor = 1;
  for(const [t,f] of Object.entries(TIME_FACTOR)){
    const [th,tm] = t.split(':').map(Number);
    if(hh*60+mm >= th*60+tm) factor = f;
  }
  return factor;
}

function updateRowValues(sym){
    const q=quoteCache[sym]||{},price=q.price||0;
    const refP=q.prevClose||q.open||price;
    const chg=+(price-refP).toFixed(2),pct=refP?+((chg/refP)*100).toFixed(2):0;
    const isUp=chg>=0,cls=isUp?'up':'dn';

    const priceEl=document.getElementById(`price-${sym}`);
    const chgEl  =document.getElementById(`chg-${sym}`);
    const metaEl =document.getElementById(`meta-${sym}`);
    const nameEl =document.getElementById(`sname-${sym}`);
    const volTagEl=document.getElementById(`voltag-${sym}`);

    if(priceEl){ priceEl.textContent=price?price.toFixed(2):'---'; priceEl.className='price '+cls; }
    if(chgEl){
      chgEl.className='chg '+cls;
      chgEl.innerHTML=price?(isUp?'+':'')+chg+' ('+(isUp?'+':'')+pct+'%)'+(q.isSnap?'<span class="snap-tag">收盤</span>':''):'';
    }

    // ── 預估量能 ──
    const curVol  = q.volume || 0;
    const prevVol = q.prevVolume || 0;  // 昨日成交量（從 snapshot 取）
    const factor  = getTimeFactor();
    const estVol  = Math.round(curVol * factor);
    const ratio   = prevVol > 0 ? estVol / prevVol : 0;
    const isBoom  = ratio >= 2.5;

    let metaText = `量 ${curVol.toLocaleString()}`;
    if(q.high)  metaText += `　高 ${q.high}`;
    if(q.low)   metaText += `　低 ${q.low}`;
    if(q.bid)   metaText += `　買 ${q.bid}`;
    if(q.ask)   metaText += `　賣 ${q.ask}`;
    if(estVol > 0 && prevVol > 0){
      metaText += `　預估 ${estVol.toLocaleString()}（${ratio.toFixed(1)}x）`;
    }
    if(metaEl) metaEl.textContent = metaText;

    // 爆量標籤
    if(volTagEl){
      if(isBoom && !q.isSnap){
        volTagEl.textContent = '⚡ 預估爆量';
        volTagEl.style.display = 'inline';
      } else {
        volTagEl.style.display = 'none';
      }
    }
    if(nameEl&&nameCache[sym]) nameEl.textContent=nameCache[sym];
}




function calcMACDData(data, fast=12, slow=26, signal=9){
  const cl=data.map(x=>x.close);
  function ema(a,p){const k=2/(p+1),r=[a[0]];for(let i=1;i<a.length;i++)r.push(+(a[i]*k+r[i-1]*(1-k)).toFixed(3));return r;}
  const e1=ema(cl,fast),e2=ema(cl,slow),macd=e1.map((v,i)=>+(v-e2[i]).toFixed(3));
  const sig=ema(macd,signal),hist=macd.map((v,i)=>+(v-sig[i]).toFixed(3));
  return{macd,sig,hist};
}

// macd 縮圖快取 { sym: {macd,sig,hist,label,fast,slow,signal} }
const macdCache={};
// 原始K線資料快取（用於參數改變時重算）
const macdRawData={};

async function drawMiniMACD(sym){
  const canvas=document.getElementById(`mini-${sym}`);
  if(!canvas) return;

  // 取得目前 MACD 參數
  const p=getP();
  const {fast,slow,signal}=p.macd;
  const cacheKey=`${fast}-${slow}-${signal}`;

  // 參數改變 or 無快取 → 重新計算
  if(!macdCache[sym] || macdCache[sym].key!==cacheKey){
    // 若已有原始資料直接重算，否則重新 fetch
    if(!macdRawData[sym]){
      // 先試 5分K
      try{
        const r=await fetch(`${API}/candles?symbol=${sym}&timeframe=5`);
        const d=await r.json();
        const data=(d.data||[]).filter(x=>x.close>0);
        if(data.length>=slow){ macdRawData[sym]={data,label:'5分'}; }
      }catch{}
      // 5分無資料 → fallback 日K
      if(!macdRawData[sym]){
        try{
          const r=await fetch(`${API}/candles?symbol=${sym}&timeframe=D`);
          const d=await r.json();
          const data=(d.data||[]).filter(x=>x.close>0);
          if(data.length>=slow){ macdRawData[sym]={data,label:'日'}; }
          else{ macdRawData[sym]=null; }
        }catch{ macdRawData[sym]=null; }
      }
    }
    if(!macdRawData[sym]){ macdCache[sym]=null; }
    else{
      const {data,label}=macdRawData[sym];
      macdCache[sym]={...calcMACDData(data,fast,slow,signal), label, key:cacheKey};
    }
  }

  const mc=macdCache[sym]; if(!mc) return;
  const hist=mc.hist.slice(-30), macd=mc.macd.slice(-30), sig=mc.sig.slice(-30);
  if(miniCharts[sym]) miniCharts[sym].destroy();
  miniCharts[sym]=new Chart(canvas,{
    type:'bar',
    data:{labels:hist.map((_,i)=>i),datasets:[
      {data:hist,backgroundColor:hist.map(v=>v>=0?'#e05c5caa':'#26a269aa'),borderWidth:0,order:2},
      {data:macd,type:'line',borderColor:'#f5a623',borderWidth:1,pointRadius:0,tension:0.3,order:1},
      {data:sig, type:'line',borderColor:'#5c8ae0', borderWidth:1,pointRadius:0,tension:0.3,order:1}
    ]},
    options:{responsive:true,maintainAspectRatio:false,animation:false,
      plugins:{legend:{display:false},tooltip:{enabled:false}},
      scales:{x:{display:false},y:{display:false}}}
  });
  const labelEl=document.getElementById(`mini-label-${sym}`);
  if(labelEl) labelEl.textContent=mc.label;
}

function mergeRealtimeToCandle(sym){

function updateDetailKLast(){
  if(!detailSym||!detailData.length) return;
  mergeRealtimeToCandle(detailSym);
  const kc=detailCharts.k,vc=detailCharts.v;if(!kc||!vc) return;
  const i=detailData.length-1,bar=detailData[i];
  const col=bar.close>=bar.open?'#e05c5c':'#26a269';
  kc.data.datasets[0].data[i]=[bar.low,bar.high];
  kc.data.datasets[0].backgroundColor[i]=col+'44';kc.data.datasets[0].borderColor[i]=col;
  kc.data.datasets[1].data[i]=[Math.min(bar.open,bar.close),Math.max(bar.open,bar.close)];
  kc.data.datasets[1].backgroundColor[i]=col;kc.data.datasets[1].borderColor[i]=col;
  const{yMin,yMax}=getYRange(detailData.slice(viewEnd-viewSize+1,viewEnd+1));
  kc.options.scales.y.min=yMin;kc.options.scales.y.max=yMax;
  const p=getP();
  p.ma.filter(m=>m.on&&m.n>0).forEach((m,idx)=>{
    const ds=kc.data.datasets[2+idx];if(!ds) return;
    const sl=detailData.slice(Math.max(0,i-m.n+1),i+1);
    if(sl.length===m.n) ds.data[i]=+(sl.reduce((a,x)=>a+x.close,0)/m.n).toFixed(2);
  });
  kc.update('none');
  vc.data.datasets[0].data[i]=bar.volume;vc.data.datasets[0].backgroundColor[i]=col+'aa';
  p.vma.filter(m=>m.on&&m.n>0).forEach((m,idx)=>{
    const ds=vc.data.datasets[1+idx];if(!ds) return;
    const sl=detailData.slice(Math.max(0,i-m.n+1),i+1);
    if(sl.length===m.n) ds.data[i]=Math.round(sl.reduce((a,x)=>a+x.volume,0)/m.n);
  });
  vc.update('none');
  // 若視窗在最右側，自動推進
  if(viewEnd===detailData.length-2){ viewEnd=detailData.length-1; applyView(); }
}

function getYRange(data){
  if(!data||!data.length) return{yMin:0,yMax:100};
  const hi=Math.max(...data.map(x=>x.high)),lo=Math.min(...data.map(x=>x.low));
  let pad=(hi-lo)*.10;if(pad===0) pad=hi*0.05||1;
  return{yMin:+(lo-pad).toFixed(2),yMax:+(hi+pad).toFixed(2)};
}
function calcMA(data,n){return data.map((_,i)=>i<n-1?null:+(data.slice(i-n+1,i+1).reduce((a,x)=>a+x.close,0)/n).toFixed(2));}
function calcVMA(data,n){return data.map((_,i)=>i<n-1?null:Math.round(data.slice(i-n+1,i+1).reduce((a,x)=>a+x.volume,0)/n));}
function calcKD(data,period,kSmooth,dSmooth){
  const k=[],d=[];
  for(let i=0;i<data.length;i++){
    const sl=data.slice(Math.max(0,i-period+1),i+1);
    const lo=Math.min(...sl.map(x=>x.low)),hi=Math.max(...sl.map(x=>x.high));
    const rsv=hi===lo?50:(data[i].close-lo)/(hi-lo)*100;
    const wk=1/kSmooth,wd=1/dSmooth,pk=i?k[i-1]:50,pd=i?d[i-1]:50;
    k.push(+(pk*(1-wk)+rsv*wk).toFixed(2));d.push(+(pd*(1-wd)+k[i]*wd).toFixed(2));
  }
  return{k,d};
}
function calcMACD(data,fast,slow,signal){
  const cl=data.map(x=>x.close);
  function ema(a,p){const k=2/(p+1),r=[a[0]];for(let i=1;i<a.length;i++)r.push(+(a[i]*k+r[i-1]*(1-k)).toFixed(3));return r;}
  const e1=ema(cl,fast),e2=ema(cl,slow),macd=e1.map((v,i)=>+(v-e2[i]).toFixed(3));
  const sig=ema(macd,signal),hist=macd.map((v,i)=>+(v-sig[i]).toFixed(3));
  return{macd,sig,hist};
}
function getP(){
  const n=id=>+document.getElementById(id).value||1,b=id=>document.getElementById(id).checked,c=getColors();
  return{
    ma:[{on:b('ma1-on'),n:n('ma1-n'),c:c.ma1},{on:b('ma2-on'),n:n('ma2-n'),c:c.ma2},{on:b('ma3-on'),n:n('ma3-n'),c:c.ma3}],
    vma:[{on:b('vma1-on'),n:n('vma1-n'),c:c.ma1},{on:b('vma2-on'),n:n('vma2-n'),c:c.ma2}],
    kd:{period:n('kd-n'),kSmooth:n('kd-k'),dSmooth:n('kd-d')},
    macd:{fast:n('macd-f'),slow:n('macd-s'),signal:n('macd-sig')}
  };
}

function buildDetailCharts(){
  Object.values(detailCharts).forEach(c=>c.destroy());detailCharts={};
  const data=detailData;if(!data.length) return;
  const p=getP(),c=getColors();
  // Y 軸以當前視窗範圍計算
  const winData=data.slice(Math.max(0,viewEnd-viewSize+1),viewEnd+1);
  const{yMin,yMax}=getYRange(winData.length?winData:data);
  const upColor=data.map(x=>x.close>=x.open?'#e05c5c':'#26a269');
  const idxLabels=data.map((_,i)=>i);  // 數字索引，配合 x.min/x.max 做視窗
  const xLabels=data.map(x=>{
    if(!x.t) return '';
    if(x.t.length===8&&tf==='D') return `${x.t.slice(4,6)}-${x.t.slice(6,8)}`;
    return tf==='D'?x.t.slice(5,10):x.t.slice(11,16);
  });

  const maDS=p.ma.filter(m=>m.on&&m.n>0).map(m=>({label:`MA${m.n}`,type:'line',data:calcMA(data,m.n),borderColor:m.c,borderWidth:1.5,pointRadius:0,tension:0,order:0}));
  const vmaDS=p.vma.filter(m=>m.on&&m.n>0).map(m=>({label:`MA${m.n}`,type:'line',data:calcVMA(data,m.n),borderColor:m.c,borderWidth:1.5,pointRadius:0,tension:0,order:0}));
  const{k,d:dLine}=calcKD(data,p.kd.period,p.kd.kSmooth,p.kd.dSmooth);
  const{macd,sig,hist}=calcMACD(data,p.macd.fast,p.macd.slow,p.macd.signal);

  const base={responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:false}}};

  detailCharts.k=new Chart(document.getElementById('d-k'),{
    type:'bar',
    data:{labels:idxLabels,datasets:[
      {label:'HL',data:data.map(x=>[x.low,x.high]),backgroundColor:upColor.map(v=>v+'44'),borderColor:[...upColor],borderWidth:1,barPercentage:0.3,order:1},
      {label:'OC',data:data.map(x=>{let o=x.open,cl=x.close;if(o===cl)cl+=(o*0.001);return[Math.min(o,cl),Math.max(o,cl)];}),backgroundColor:[...upColor],borderColor:[...upColor],borderWidth:1,barPercentage:0.7,order:1},
      ...maDS
    ]},
    options:{...base,
      plugins:{...base.plugins,tooltip:{callbacks:{
        title:(items)=>[xLabels[items[0].dataIndex]||''],
        label:(ctx)=>{ if(ctx.datasetIndex>1) return`${ctx.dataset.label}: ${ctx.parsed.y}`; const b=data[ctx.dataIndex]; return[`開 ${b.open}`,`高 ${b.high}`,`低 ${b.low}`,`收 ${b.close}`]; }
      }}},
      scales:{
        x:{type:'linear',ticks:{stepSize:1,callback:(v)=>Number.isInteger(v)?xLabels[v]||'':'',font:{size:10},maxTicksLimit:10,color:c.tick},grid:{display:false}},
        y:{min:yMin,max:yMax,ticks:{font:{size:10},color:c.tick,callback:v=>v.toFixed(0)},grid:{color:c.grid}}
      }
    }
  });

  detailCharts.v=new Chart(document.getElementById('d-v'),{
    type:'bar',
    data:{labels:idxLabels,datasets:[{label:'量',data:data.map(x=>x.volume),backgroundColor:upColor.map(v=>v+'aa'),borderWidth:0,order:1},...vmaDS]},
    options:{...base,scales:{x:{type:'linear',display:false},y:{ticks:{font:{size:9},maxTicksLimit:3,color:c.tick},grid:{color:c.grid}}}}
  });

  document.getElementById('kd-label').textContent=`KD (${p.kd.period},${p.kd.kSmooth},${p.kd.dSmooth})`;
  detailCharts.kd=new Chart(document.getElementById('d-kd'),{
    type:'line',
    data:{labels:idxLabels,datasets:[{label:'K',data:k,borderColor:'#f5a623',borderWidth:1.5,pointRadius:0,tension:0.3},{label:'D',data:dLine,borderColor:'#5c8ae0',borderWidth:1.5,pointRadius:0,tension:0.3}]},
    options:{...base,scales:{x:{type:'linear',display:false},y:{min:0,max:100,ticks:{font:{size:9},maxTicksLimit:3,color:c.tick},grid:{color:c.grid}}}}
  });

  document.getElementById('macd-label').textContent=`MACD (${p.macd.fast},${p.macd.slow},${p.macd.signal})`;
  detailCharts.macd=new Chart(document.getElementById('d-macd'),{
    type:'bar',
    data:{labels:idxLabels,datasets:[
      {label:'柱',data:hist,backgroundColor:hist.map(v=>v>=0?'#e05c5caa':'#26a269aa'),borderWidth:0,order:2},
      {label:'MACD',data:macd,type:'line',borderColor:'#f5a623',borderWidth:1.5,pointRadius:0,tension:0.3,order:1},
      {label:'Signal',data:sig,type:'line',borderColor:'#5c8ae0',borderWidth:1.5,pointRadius:0,tension:0.3,order:1}
    ]},
    options:{...base,scales:{x:{type:'linear',display:false},y:{ticks:{font:{size:9},maxTicksLimit:3,color:c.tick},grid:{color:c.grid}}}}
  });

  renderLegend('ma-legend',p.ma.filter(m=>m.on&&m.n>0).map(m=>({c:m.c,label:`MA${m.n}`})));
  renderLegend('vma-legend',p.vma.filter(m=>m.on&&m.n>0).map(m=>({c:m.c,label:`MA${m.n}`})));
}

function renderLegend(id, items){
  document.getElementById(id).innerHTML = items.map(it =>
    `<span data-legend-key="${it.label}" style="display:flex;align-items:center;gap:3px;font-size:11px;color:var(--sub)">` +
    `<span style="width:14px;height:2px;background:${it.c};border-radius:1px;display:inline-block"></span>` +
    `<span class="legend-val">${it.label}</span></span>`
  ).join('');
}

// 滑鼠移到 K 線圖時，更新 MA legend 數值
function updateMALegendAtIndex(idx) {
  const chart = detailCharts.k;
  if (!chart || idx < 0) return;
  chart.data.datasets.forEach(ds => {
    if (!ds.label || !ds.label.startsWith('MA')) return;
    const val = ds.data[idx];
    const span = document.querySelector(`#ma-legend [data-legend-key="${ds.label}"] .legend-val`);
    if (!span) return;
    span.textContent = val != null ? `${ds.label}: ${(+val).toFixed(2)}` : ds.label;
  });
}
function resetMALegend() {
  document.querySelectorAll('#ma-legend [data-legend-key] .legend-val').forEach(span => {
    const key = span.closest('[data-legend-key]').dataset.legendKey;
    span.textContent = key;
  });
}
function togglePanel(){document.getElementById('main-panel').classList.toggle('open');}
document.addEventListener('click',e=>{if(!e.target.closest('.prel')) document.querySelectorAll('.panel.open').forEach(p=>p.classList.remove('open'));});

// 鍵盤：查價線模式 ← → 移動查價線；否則切換個股；Esc 返回
document.addEventListener('keydown',e=>{
  if(!detailSym) return;
  if(e.key==='Escape'){
    if(priceLineActive){ togglePriceLine(); return; }
    closeDetail(); return;
  }
  if(priceLineActive){
    if(e.key==='ArrowLeft'){
      e.preventDefault();
      const min = Math.floor(detailCharts.k?.scales?.x?.min ?? 0);
      movePLToIndex(Math.max(min, priceLineIndex - 1));
    }
    if(e.key==='ArrowRight'){
      e.preventDefault();
      const max = Math.floor(detailCharts.k?.scales?.x?.max ?? detailData.length-1);
      movePLToIndex(Math.min(max, priceLineIndex + 1));
    }
    return;
  }
  if(e.key==='ArrowLeft'||e.key==='ArrowUp')   navStock(-1);
  if(e.key==='ArrowRight'||e.key==='ArrowDown') navStock(1);
});

(async function init(){
  loadIndicatorSettings();  // 頁面載入時恢復參數設定
  await checkConn();renderRows();await waitForSDK();
  if(stocks.length){
    fetch(`${API}/subscribe`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbols:stocks})}).catch(()=>{});
    for(const sym of stocks) await fetchSnapshot(sym);
  }
  startPoll();
})();

async function waitForSDK(){
  setStatus('SDK 登入中，請稍候...','');
  for(let i=0;i<30;i++){
    try{if((await(await fetch(`${API}/ready`)).json()).ready){setStatus('後端已連線','ok');return;}}catch{}
    await new Promise(r=>setTimeout(r,2000));
  }
  setStatus('SDK 連線逾時，請重新整理','err');
}
</script>
